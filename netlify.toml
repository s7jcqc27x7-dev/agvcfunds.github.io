[build]
  publish = "."
  command = ""

[[redirects]]
  from = "/partnering"
  to = "/partnering.html"
  status = 200

[[redirects]]
  from = "/intelligence"
  to = "/intelligence.html"
  status = 200

[[redirects]]
  from = "/longevitysprint"
  to = "/longevitysprint.html"
  status = 200

# former /services URL — kept so existing links and search results still resolve
[[redirects]]
  from = "/services"
  to = "/longevitysprint"
  status = 301

[[redirects]]
  from = "/team"
  to = "/team.html"
  status = 200

# ── Consolidated legacy routes (see AUDIT.md) ──
# force = true is required: the old .html files remain as redirect stubs, and
# Netlify ignores a redirect rule when a file already matches the path.
[[redirects]]
  from = "/about"
  to = "/partnering"
  status = 301
  force = true

[[redirects]]
  from = "/about.html"
  to = "/partnering"
  status = 301
  force = true

[[redirects]]
  from = "/longevity-asia"
  to = "/intelligence"
  status = 301
  force = true

[[redirects]]
  from = "/longevity-asia.html"
  to = "/intelligence"
  status = 301
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
